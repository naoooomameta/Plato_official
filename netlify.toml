[build]
  publish = "."
  command = ""

# note更新情報（data/note-feed.json）は GitHub Actions が随時更新するため、常に最新を配信する
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 講師プロフィール画像：ブラウザに1週間キャッシュさせ、2回目以降の表示を即時にする
[[headers]]
  for = "/img/*-profile.*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
