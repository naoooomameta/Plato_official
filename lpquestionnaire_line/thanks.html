<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>診断完了｜プラトン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;}
body{
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;
  background:#f0f6ff;
  color:#1a1a2e;
  min-height:100dvh;
  display:flex;flex-direction:column;
}

/* Header */
.header{
  background:#fff;
  padding:12px 16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border-bottom:1px solid #e2e8f0;
}
.header img{width:40px;height:40px;object-fit:contain;}
.header-name{font-size:18px;font-weight:900;color:#1a56db;letter-spacing:1px;}

/* Main */
.main{
  flex:1;
  padding:24px 16px 32px;
  max-width:480px;
  margin:0 auto;
  width:100%;
}

/* Success Banner */
.success-banner{
  display:flex;align-items:center;gap:14px;
  background:#f0fdf4;border:1.5px solid #bbf7d0;
  border-radius:14px;padding:16px 18px;
  margin-bottom:24px;
  animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn{0%{transform:scale(0.9);opacity:0;}100%{transform:scale(1);opacity:1;}}
.success-icon{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#10b981,#34d399);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(16,185,129,0.3);
}
.success-icon svg{width:22px;height:22px;}
.success-title{font-size:16px;font-weight:900;color:#1a1a2e;line-height:1.4;}
.success-sub{font-size:12px;color:#10b981;font-weight:700;margin-top:2px;}

/* Summary Card */
.summary-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 12px rgba(26,86,219,0.06);
  border:1px solid #e2e8f0;
}
.summary-title{
  font-size:14px;font-weight:900;color:#1a56db;
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:2px solid #dbeafe;
}
.summary-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 0;
  border-bottom:1px solid #f1f5f9;
  gap:12px;
}
.summary-row:last-child{border-bottom:none;}
.summary-label{
  font-size:12px;font-weight:700;color:#64748b;
  white-space:nowrap;flex-shrink:0;
}
.summary-value{
  font-size:13px;font-weight:700;color:#1a1a2e;
  text-align:right;word-break:break-all;
}

/* Message Card */
.message-card{
  background:linear-gradient(135deg,#1a56db 0%,#2b6cb0 100%);
  border-radius:16px;
  padding:24px 20px;
  color:#fff;
  text-align:center;
  margin-bottom:20px;
}
.message-card h3{
  font-size:16px;font-weight:900;
  margin-bottom:10px;line-height:1.5;
}
.message-card p{
  font-size:13px;line-height:1.7;
  opacity:0.9;
}

/* Info Box */
.info-box{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 2px 12px rgba(26,86,219,0.06);
  border:1px solid #e2e8f0;
  margin-bottom:20px;
}
.info-box-title{
  font-size:14px;font-weight:900;color:#1a56db;
  margin-bottom:12px;
}
.info-box ul{
  list-style:none;padding:0;
}
.info-box li{
  font-size:13px;color:#334155;
  padding:8px 0;
  border-bottom:1px solid #f1f5f9;
  line-height:1.6;
}
.info-box li:last-child{border-bottom:none;}
.info-box li::before{
  content:'✓';
  color:#10b981;font-weight:900;margin-right:8px;
}

/* Back Link */
.back-link{
  display:block;
  text-align:center;
  padding:16px;
  font-size:13px;font-weight:700;
  color:#1a56db;text-decoration:none;
}

/* Footer */
.footer{
  text-align:center;padding:16px 12px 24px;
  background:#f0f4f8;font-size:11px;color:#94a3b8;
}
.footer a{color:#64748b;text-decoration:none;}
</style>
</head>
<body>

<div class="header">
  <img src="images/logo.png" alt="プラトン">
  <span class="header-name">プラトン</span>
</div>

<div class="main">

  <!-- Success Banner -->
  <div class="success-banner">
    <div class="success-icon">
      <svg viewBox="0 0 36 36" fill="none"><path d="M8 18l7 7 13-13" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="success-title">診断が完了しました！</div>
      <div class="success-sub">ご回答ありがとうございます</div>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card">
    <div class="summary-title">あなたの回答内容</div>
    <div class="summary-row">
      <span class="summary-label">学年</span>
      <span class="summary-value" id="sumGrade">-</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">志望大学・学部</span>
      <span class="summary-value" id="sumTarget">-</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">現在の偏差値</span>
      <span class="summary-value" id="sumDev">-</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">苦手・対策科目</span>
      <span class="summary-value" id="sumSubjects">-</span>
    </div>
  </div>

  <!-- Message -->
  <div class="message-card">
    <h3>診断結果をもとに<br>あなた専用の合格戦略を<br>作成しています</h3>
    <p>プロの講師がお子様の現状を分析し、<br>志望校合格までの最適なロードマップを<br>ご提案いたします。</p>
  </div>

  <!-- Next Steps -->
  <div class="info-box">
    <div class="info-box-title">今後の流れ</div>
    <ul>
      <li>回答内容をもとに講師が分析します</li>
      <li>お子様専用の合格ロードマップを作成</li>
      <li>LINEにて結果をお届けします</li>
    </ul>
  </div>

  <a href="/Plato_official/lpquestionnaire_line/" class="back-link">← 診断ページに戻る</a>

</div>

<div class="footer">
  <a href="/lpquestionnaire_line/privacy.html">プライバシーポリシー</a>
  <span style="margin:0 6px;">｜</span>
  <a href="/lpquestionnaire_line/contact.html">お問い合わせ</a>
  <span style="margin:0 6px;">｜</span>
  <span>&copy; 2026 プラトン 文系の大学受験専門塾</span>
</div>

<script>
// URLパラメータから回答データを読み取って表示
const params = new URLSearchParams(window.location.search);

document.getElementById('sumGrade').textContent = params.get('grade') || '-';

const target = params.get('target');
if (target) {
  const targets = target.split('|');
  const labels = ['①','②','③'];
  document.getElementById('sumTarget').innerHTML = targets.map((t, i) =>
    targets.length > 1 ? '<span style="color:#94a3b8;font-size:11px;">' + labels[i] + '</span> ' + t : t
  ).join('<br>');
}

document.getElementById('sumDev').textContent = params.get('deviation') || '-';

const subjects = params.get('subjects');
if (subjects) {
  document.getElementById('sumSubjects').textContent = subjects.split(',').join('・');
}
</script>

</body>
</html>
