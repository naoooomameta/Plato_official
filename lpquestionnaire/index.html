<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>プラトン｜偏差値UPロードマップ無料診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;scroll-behavior:smooth;}
body{
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;
  background:#f0f6ff;
  color:#1a1a2e;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ═══════════════════════════════════════
   SECTION 1 — FV (Cyteki-style)
   ═══════════════════════════════════════ */

/* Top Banner */
.top-banner{
  background:linear-gradient(90deg,#1a56db 0%,#2b6cb0 100%);
  color:#fff;
  text-align:center;
  padding:10px 16px;
  font-size:13px;
  font-weight:700;
  letter-spacing:0.5px;
  position:relative;
}
.top-banner::after{
  content:'';position:absolute;bottom:-6px;left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:6px solid #1a56db;
}


/* Logo Bar */
.logo-bar{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:10px 16px;
  background:#fff;
}
.logo-bar img{
  width:48px;height:48px;
  object-fit:contain;
}
.logo-text-wrap{
  display:flex;flex-direction:column;line-height:1.2;
}
.logo-sub{
  font-size:10px;font-weight:700;
  color:#64748b;letter-spacing:0.5px;
}
.logo-name{
  font-size:22px;font-weight:900;
  color:#1a56db;letter-spacing:1.5px;
}
/* Stats Bar */
.stats-bar{
  display:flex;align-items:center;justify-content:center;
  gap:0;padding:14px 12px;
  background:#fff;
}
.stat-item{
  flex:1;text-align:center;
}
.stat-num{
  font-size:26px;font-weight:900;color:#1a56db;
  line-height:1;
}
.stat-num span{
  font-size:13px;font-weight:700;margin-left:1px;
}
.stat-label{
  font-size:9px;font-weight:700;color:#94a3b8;
  margin-top:3px;letter-spacing:0.3px;
}
.stat-divider{
  width:1px;height:32px;background:#e2e8f0;
  flex-shrink:0;
}

/* Hero FV */
.hero-fv{
  background:#fff;text-align:center;padding:24px 20px 0;
  position:relative;overflow:hidden;
}
.hex-bg{position:absolute;top:-20px;right:-30px;width:200px;height:200px;opacity:0.06;}
.hex-bg2{position:absolute;top:180px;left:-40px;width:160px;height:160px;opacity:0.04;transform:rotate(30deg);}

.impact-area{position:relative;margin-bottom:16px;}
.impact-copy{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  animation:numberPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes numberPop{0%{transform:scale(0.3);opacity:0;}100%{transform:scale(1);opacity:1;}}
.impact-top{
  font-size:28px;font-weight:900;color:#1a1a2e;
  letter-spacing:1px;line-height:1.2;
  margin-bottom:4px;
}
.impact-top::before,
.impact-top::after{
  content:'';display:inline-block;
  width:24px;height:3px;background:#f59e0b;
  border-radius:2px;vertical-align:middle;margin:0 10px;
}
.impact-bottom{
  font-size:72px;font-weight:900;color:#1a56db;
  line-height:1;letter-spacing:-2px;
  text-shadow:3px 3px 0 rgba(26,86,219,0.1);
}
.impact-bottom-sub{
  font-size:40px;font-weight:900;color:#1a1a2e;
  letter-spacing:0;
}

/* FV CTA */
.fv-cta{
  text-align:center;
  margin:32px 16px 8px;
  position:relative;z-index:1;
}
.fv-cta-wrap{
  position:relative;display:inline-block;width:100%;max-width:300px;
  cursor:pointer;transition:all 0.2s;
}
.fv-cta-wrap:hover{transform:translateY(-2px);}
.fv-cta-wrap:active{transform:scale(0.98);}
.fv-cta-ribbon{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  background:#ef4444;color:#fff;
  font-size:14px;font-weight:900;
  padding:5px 24px;border-radius:100px;
  letter-spacing:2px;
  box-shadow:0 3px 12px rgba(239,68,68,0.4);
  z-index:2;white-space:nowrap;
  animation:ribbonPop 2s ease-in-out infinite;
}
@keyframes ribbonPop{
  0%,100%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.05);}
}
.fv-cta-mega{
  width:100%;padding:26px 20px 18px;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  border-radius:16px;
  box-shadow:0 8px 30px rgba(245,158,11,0.4);
  margin-top:8px;
  position:relative;overflow:hidden;
}
.fv-cta-mega::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  animation:shine 3s infinite;
}
.fv-cta-mega-text{
  font-size:20px;font-weight:900;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.fv-cta-mega-sub{
  font-size:11px;color:rgba(255,255,255,0.7);
  margin-top:6px;
}
.fv-cta-arrow{
  font-size:22px;transition:transform 0.2s;
}
.fv-cta-wrap:hover .fv-cta-arrow{transform:translateX(4px);}
.fv-cta-micro{
  font-size:11px;color:#64748b;
  font-weight:600;margin-top:4px;
  display:flex;align-items:flex-start;justify-content:center;gap:5px;
  text-align:center;line-height:1.6;
}
.fv-cta-micro svg{flex-shrink:0;margin-top:2px;}

/* Sparks */
.spark{position:absolute;z-index:2;}
.spark1{top:10px;right:20px;width:40px;animation:sparkle 2s ease-in-out infinite;}
.spark2{top:60px;left:15px;width:30px;animation:sparkle 2s ease-in-out infinite 0.5s;}
.spark3{bottom:30px;right:10px;width:35px;animation:sparkle 2s ease-in-out infinite 1s;}
@keyframes sparkle{0%,100%{opacity:0.4;transform:scale(0.8) rotate(0deg);}50%{opacity:1;transform:scale(1.2) rotate(15deg);}}

/* Visual Area */
.visual-area{position:relative;margin:20px auto 0;max-width:320px;}
.pain-badge{
  position:absolute;top:10px;left:-10px;z-index:3;
  background:linear-gradient(135deg,#1a56db,#2b6cb0);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:15px;font-weight:900;
  line-height:1.4;box-shadow:0 4px 15px rgba(26,86,219,0.3);
  transform:rotate(-3deg);animation:badgeFloat 3s ease-in-out infinite;
}
@keyframes badgeFloat{0%,100%{transform:rotate(-3deg) translateY(0);}50%{transform:rotate(-3deg) translateY(-5px);}}

.monitor-wrap{position:relative;width:260px;margin:0 auto;}
.monitor{
  width:100%;background:linear-gradient(135deg,#eef2ff,#dbeafe);
  border:3px solid #93c5fd;border-radius:16px;padding:16px;
  position:relative;box-shadow:0 8px 30px rgba(26,86,219,0.12);
}
.monitor-screen{background:#fff;border-radius:10px;padding:14px;position:relative;}
.mini-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:8px;}
.mini-bar{flex:1;border-radius:4px 4px 0 0;animation:barGrow 1s ease-out both;}
@keyframes barGrow{from{height:0 !important;}}
.mini-bar:nth-child(1){background:#93c5fd;height:25%;}
.mini-bar:nth-child(2){background:#60a5fa;height:35%;}
.mini-bar:nth-child(3){background:#3b82f6;height:45%;}
.mini-bar:nth-child(4){background:#2563eb;height:58%;}
.mini-bar:nth-child(5){background:#1d4ed8;height:72%;}
.mini-bar:nth-child(6){background:linear-gradient(180deg,#f59e0b,#fbbf24);height:100%;position:relative;border:2px solid #f59e0b;}
.mini-bar:nth-child(6)::after{content:'🎯';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:14px;}
.mini-label{display:flex;justify-content:space-between;font-size:9px;color:#94a3b8;font-weight:700;}
.monitor-stand{width:60px;height:12px;background:#93c5fd;margin:8px auto 0;border-radius:0 0 8px 8px;}

/* Mascot */
.mascot{position:absolute;bottom:-20px;right:-20px;z-index:4;width:100px;height:auto;animation:mascotBounce 3s ease-in-out infinite;}
@keyframes mascotBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

/* Omakase */
.omakase-area{background:#fff;text-align:center;padding:20px 20px 28px;}
.omakase-brand{font-size:20px;font-weight:700;color:#64748b;margin-bottom:-4px;}
.omakase-brand em{font-style:normal;color:#1a56db;font-weight:900;font-size:24px;}
.omakase-main{font-size:38px;font-weight:900;color:#1a1a2e;line-height:1.3;margin:4px 0;letter-spacing:-1px;}
.omakase-main .blue{color:#1a56db;}
.omakase-main .gold-underline{position:relative;display:inline-block;}
.omakase-main .gold-underline::after{
  content:'';position:absolute;bottom:2px;left:-4px;right:-4px;
  height:10px;background:linear-gradient(90deg,rgba(251,191,36,0.4),rgba(245,158,11,0.4));
  border-radius:5px;z-index:-1;
}

/* ═══════════════════════════════════════
   FV → SURVEY BRIDGE
   ═══════════════════════════════════════ */
.bridge-section{
  background:linear-gradient(180deg,#fff 0%,#eef2ff 50%,#dbeafe 100%);
  text-align:center;
  padding:32px 20px 40px;
  display:flex;flex-direction:column;align-items:center;
}
.bridge-heading{
  font-size:20px;font-weight:900;color:#1a1a2e;
  line-height:1.5;margin-bottom:8px;
}
.bridge-heading .blue{color:#1a56db;}
.bridge-heading .num{
  font-size:32px;color:#1a56db;
  position:relative;display:inline-block;
}
.bridge-heading .num::after{
  content:'';position:absolute;bottom:0;left:-2px;right:-2px;
  height:4px;background:#fbbf24;border-radius:2px;
}
.bridge-sub{font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.7;}
.bridge-steps{
  display:flex;align-items:center;justify-content:center;gap:4px;
  margin-bottom:24px;
}
.bridge-step{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  width:90px;
}
.bridge-step-icon{
  width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;
  box-shadow:0 4px 15px rgba(26,86,219,0.1);
  border:1.5px solid #dbeafe;
}
.bridge-step-icon svg{width:48px;height:48px;}
.bridge-step-label{font-size:10px;font-weight:700;color:#64748b;line-height:1.3;text-align:center;}
.bridge-arrow{color:#93c5fd;font-size:20px;margin-top:-20px;font-weight:700;}

/* Bridge Benefits */
.bri
