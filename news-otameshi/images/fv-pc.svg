<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="お試しコース 3,980円｜まずは1週間、プラトンの指導を体験">
  <defs>
    <linearGradient id="fvpc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A1E27"/>
      <stop offset="1" stop-color="#6B2C39"/>
    </linearGradient>
    <linearGradient id="fvpc-medal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF8F3"/>
      <stop offset="1" stop-color="#F5EBE0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" fill="url(#fvpc-bg)"/>

  <!-- decorative accents -->
  <circle cx="1160" cy="40" r="230" fill="#8B4151" opacity="0.18"/>
  <circle cx="110" cy="430" r="170" fill="#8B4151" opacity="0.13"/>

  <!-- eyebrow -->
  <line x1="80" y1="92" x2="138" y2="92" stroke="#B8893A" stroke-width="1.5"/>
  <text x="150" y="98" fill="#E8DCD0" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="18" letter-spacing="5">文系の大学受験専門塾　プラトン</text>

  <!-- catch copy -->
  <text x="78" y="188" fill="#FDF8F3" font-family="'Noto Serif JP','Yu Mincho',serif" font-weight="600" font-size="56" letter-spacing="2">まずは1週間、</text>
  <text x="78" y="260" fill="#FDF8F3" font-family="'Noto Serif JP','Yu Mincho',serif" font-weight="600" font-size="56" letter-spacing="2">プラトンの指導を<tspan fill="#E7B96B">体験する。</tspan></text>

  <!-- sub copy -->
  <text x="80" y="328" fill="#E8DCD0" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="22" letter-spacing="1">オンライン60分マンツーマン指導 ＋ 1週間の毎日課題体験</text>

  <!-- price medallion -->
  <circle cx="1012" cy="220" r="138" fill="url(#fvpc-medal)"/>
  <circle cx="1012" cy="220" r="138" fill="none" stroke="#B8893A" stroke-width="2"/>
  <circle cx="1012" cy="220" r="125" fill="none" stroke="#B8893A" stroke-width="1" opacity="0.45"/>
  <text x="1012" y="160" text-anchor="middle" fill="#6B2C39" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="20" letter-spacing="4">初回限定</text>
  <text x="1012" y="248" text-anchor="middle" fill="#6B2C39" font-family="'Noto Serif JP','Yu Mincho',serif" font-weight="700" font-size="72">3,980<tspan font-size="34" dx="2">円</tspan></text>
  <text x="1012" y="294" text-anchor="middle" fill="#8A7B7F" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="18" letter-spacing="2">1回のみ・税込</text>
</svg>
